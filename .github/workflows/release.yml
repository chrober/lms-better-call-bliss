name: Publish Better Call Bliss

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Plugin version/tag. Empty reads BetterCallBliss/install.xml."
        required: false
        default: ""
      optimizer_release:
        description: "bliss-playlist-optimizer release tag. Empty reads BetterCallBliss/Bin/SOURCE.md."
        required: false
        default: ""
      prerelease:
        description: "Mark the GitHub release as prerelease."
        type: boolean
        required: true
        default: false
      dry_run:
        description: "Build and upload workflow artifacts only; do not create release or update lms-plugins."
        type: boolean
        required: true
        default: false
      update_lms_plugins:
        description: "Update chrober/lms-plugins repo.xml after publishing the release."
        type: boolean
        required: true
        default: true
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

env:
  OPTIMIZER_REPO: chrober/bliss-playlist-optimizer
  PLUGIN_REPO: chrober/lms-plugins

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Perl test dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes libjson-xs-perl libdbi-perl libdbd-sqlite3-perl libfile-slurp-perl
      - name: Prepare LMS plugin load path
        run: |
          set -euo pipefail
          mkdir -p Plugins
          ln -s ../BetterCallBliss Plugins/BetterCallBliss
      - name: Run plugin regression tests
        run: prove -l tests
      - name: Run release feed updater tests
        run: python -m unittest discover -s tests -p "test_*.py"

  package-release:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      linux_asset: ${{ steps.meta.outputs.linux_asset }}
      mac_asset: ${{ steps.meta.outputs.mac_asset }}
      windows_asset: ${{ steps.meta.outputs.windows_asset }}
      linux_url: ${{ steps.meta.outputs.linux_url }}
      mac_url: ${{ steps.meta.outputs.mac_url }}
      windows_url: ${{ steps.meta.outputs.windows_url }}
      linux_sha1: ${{ steps.package.outputs.linux_sha1 }}
      mac_sha1: ${{ steps.package.outputs.mac_sha1 }}
      windows_sha1: ${{ steps.package.outputs.windows_sha1 }}
    steps:
      - uses: actions/checkout@v4

      - name: Derive release metadata
        id: meta
        env:
          VERSION_INPUT: ${{ github.event_name == 'workflow_dispatch' && inputs.version || '' }}
          OPTIMIZER_RELEASE_INPUT: ${{ github.event_name == 'workflow_dispatch' && inputs.optimizer_release || '' }}
        run: |
          set -euo pipefail
          version="$VERSION_INPUT"
          if [ -z "$version" ]; then
            if [[ "$GITHUB_REF" == refs/tags/* ]]; then
              version="${GITHUB_REF_NAME#v}"
            else
              version="$(python -c 'import xml.etree.ElementTree as ET; print(ET.parse("BetterCallBliss/install.xml").getroot().findtext("version"))')"
            fi
          fi
          if [ -z "$version" ]; then
            echo "Could not determine plugin version" >&2
            exit 1
          fi

          install_version="$(python -c 'import xml.etree.ElementTree as ET; print(ET.parse("BetterCallBliss/install.xml").getroot().findtext("version"))')"
          if [ "$version" != "$install_version" ]; then
            echo "Requested version $version does not match BetterCallBliss/install.xml version $install_version" >&2
            exit 1
          fi

          optimizer_release="$OPTIMIZER_RELEASE_INPUT"
          if [ -z "$optimizer_release" ]; then
            optimizer_release="$(python -c 'import pathlib,re; text=pathlib.Path("BetterCallBliss/Bin/SOURCE.md").read_text(encoding="utf-8"); match=re.search(r"Optimizer release:\s*`([^`]+)`", text); print(match.group(1) if match else "")')"
          fi
          if [ -z "$optimizer_release" ]; then
            echo "Could not determine optimizer release tag" >&2
            exit 1
          fi

          tag="$version"
          linux_asset="lms-better-call-bliss-linux-$version.zip"
          mac_asset="lms-better-call-bliss-mac-$version.zip"
          windows_asset="lms-better-call-bliss-windows-$version.zip"
          base_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/$tag"

          {
            echo "version=$version"
            echo "tag=$tag"
            echo "optimizer_release=$optimizer_release"
            echo "linux_asset=$linux_asset"
            echo "mac_asset=$mac_asset"
            echo "windows_asset=$windows_asset"
            echo "linux_url=$base_url/$linux_asset"
            echo "mac_url=$base_url/$mac_asset"
            echo "windows_url=$base_url/$windows_asset"
          } >> "$GITHUB_OUTPUT"

      - name: Download optimizer release binaries
        env:
          GH_TOKEN: ${{ github.token }}
          OPTIMIZER_RELEASE: ${{ steps.meta.outputs.optimizer_release }}
        run: |
          set -euo pipefail
          mkdir -p optimizer-assets
          gh release download "$OPTIMIZER_RELEASE" \
            --repo "$OPTIMIZER_REPO" \
            --dir optimizer-assets \
            --pattern 'bliss-playlist-optimizer-*'
          ls -l optimizer-assets
          (cd optimizer-assets && sha256sum -c *.sha256)

      - name: Install optimizer binaries into plugin tree
        run: |
          set -euo pipefail
          install -m 0755 -D optimizer-assets/bliss-playlist-optimizer-aarch64-linux BetterCallBliss/Bin/aarch64-linux/bliss-playlist-optimizer
          install -m 0755 -D optimizer-assets/bliss-playlist-optimizer-armhf-linux BetterCallBliss/Bin/armhf-linux/bliss-playlist-optimizer
          install -m 0755 -D optimizer-assets/bliss-playlist-optimizer-x86_64-linux BetterCallBliss/Bin/x86_64-linux/bliss-playlist-optimizer
          install -m 0755 -D optimizer-assets/bliss-playlist-optimizer-mac BetterCallBliss/Bin/mac/bliss-playlist-optimizer
          install -m 0644 -D optimizer-assets/bliss-playlist-optimizer-windows.exe BetterCallBliss/Bin/windows/bliss-playlist-optimizer.exe
          find BetterCallBliss/Bin -maxdepth 2 -type f -print

      - name: Verify bundled Linux optimizer contract
        run: |
          set -euo pipefail
          BetterCallBliss/Bin/x86_64-linux/bliss-playlist-optimizer version --json

      - name: Package platform plugin archives
        id: package
        env:
          LINUX_ASSET: ${{ steps.meta.outputs.linux_asset }}
          MAC_ASSET: ${{ steps.meta.outputs.mac_asset }}
          WINDOWS_ASSET: ${{ steps.meta.outputs.windows_asset }}
        run: |
          set -euo pipefail
          mkdir -p dist staging
          package_platform() {
            platform="$1"
            asset="$2"
            rm -rf staging/BetterCallBliss
            cp -a BetterCallBliss staging/BetterCallBliss
            case "$platform" in
              linux) rm -rf staging/BetterCallBliss/Bin/mac staging/BetterCallBliss/Bin/windows ;;
              mac) rm -rf staging/BetterCallBliss/Bin/aarch64-linux staging/BetterCallBliss/Bin/armhf-linux staging/BetterCallBliss/Bin/x86_64-linux staging/BetterCallBliss/Bin/windows ;;
              windows) rm -rf staging/BetterCallBliss/Bin/aarch64-linux staging/BetterCallBliss/Bin/armhf-linux staging/BetterCallBliss/Bin/x86_64-linux staging/BetterCallBliss/Bin/mac ;;
            esac
            (cd staging && zip -q -r "../dist/$asset" BetterCallBliss)
          }
          package_platform linux "$LINUX_ASSET"
          package_platform mac "$MAC_ASSET"
          package_platform windows "$WINDOWS_ASSET"
          for asset in "$LINUX_ASSET" "$MAC_ASSET" "$WINDOWS_ASSET"; do
            (cd dist && sha1sum "$asset" > "$asset.sha1")
            (cd dist && sha256sum "$asset" > "$asset.sha256")
          done
          echo "linux_sha1=$(sha1sum "dist/$LINUX_ASSET" | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "mac_sha1=$(sha1sum "dist/$MAC_ASSET" | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "windows_sha1=$(sha1sum "dist/$WINDOWS_ASSET" | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Verify platform archive layouts
        env:
          LINUX_ASSET: ${{ steps.meta.outputs.linux_asset }}
          MAC_ASSET: ${{ steps.meta.outputs.mac_asset }}
          WINDOWS_ASSET: ${{ steps.meta.outputs.windows_asset }}
        run: |
          set -euo pipefail
          unzip -l "dist/$LINUX_ASSET" | grep 'BetterCallBliss/Bin/x86_64-linux/bliss-playlist-optimizer'
          unzip -l "dist/$LINUX_ASSET" | grep 'BetterCallBliss/Bin/aarch64-linux/bliss-playlist-optimizer'
          unzip -l "dist/$LINUX_ASSET" | grep 'BetterCallBliss/Bin/armhf-linux/bliss-playlist-optimizer'
          unzip -l "dist/$MAC_ASSET" | grep 'BetterCallBliss/Bin/mac/bliss-playlist-optimizer'
          unzip -l "dist/$WINDOWS_ASSET" | grep 'BetterCallBliss/Bin/windows/bliss-playlist-optimizer.exe'
          if unzip -Z1 "dist/$LINUX_ASSET" | grep -Eq 'Bin/(mac|windows)/'; then exit 1; fi
          if unzip -Z1 "dist/$MAC_ASSET" | grep -Eq 'Bin/(windows|x86_64-linux|aarch64-linux|armhf-linux)/'; then exit 1; fi
          if unzip -Z1 "dist/$WINDOWS_ASSET" | grep -Eq 'Bin/(mac|x86_64-linux|aarch64-linux|armhf-linux)/'; then exit 1; fi

      - name: Upload packages as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: better-call-bliss-${{ steps.meta.outputs.version }}
          path: dist/*
          if-no-files-found: error

      - name: Publish GitHub release
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
          VERSION: ${{ steps.meta.outputs.version }}
          OPTIMIZER_RELEASE: ${{ steps.meta.outputs.optimizer_release }}
          PRERELEASE: ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease || false }}
        run: |
          set -euo pipefail
          notes="dist/release-notes.md"
          {
            echo "# Better Call Bliss $VERSION"
            echo
            echo "Platform-specific installable LMS plugin packages. The Linux archive contains x86_64, AArch64, and ARMHF optimizer binaries; the macOS and Windows archives contain only their matching optimizer binary."
            echo
            echo "Bundled optimizer release: $OPTIMIZER_RELEASE"
          } > "$notes"

          prerelease_flag=()
          if [ "$PRERELEASE" = "true" ]; then
            prerelease_flag=(--prerelease)
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.zip dist/*.sha1 dist/*.sha256 --clobber
          else
            gh release create "$TAG" dist/*.zip dist/*.sha1 dist/*.sha256 \
              --title "Better Call Bliss $VERSION" \
              --notes-file "$notes" \
              "${prerelease_flag[@]}"
          fi

      - name: Require cross-repo token for lms-plugins update
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) && (github.event_name != 'workflow_dispatch' || inputs.update_lms_plugins) }}
        env:
          LMS_PLUGINS_TOKEN: ${{ secrets.LMS_PLUGINS_TOKEN || secrets.MS_PLUGINS_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$LMS_PLUGINS_TOKEN" ]; then
            echo "Set repository secret LMS_PLUGINS_TOKEN or MS_PLUGINS_TOKEN with contents:write access to $PLUGIN_REPO." >&2
            exit 1
          fi

      - name: Checkout lms-plugins feed repository
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) && (github.event_name != 'workflow_dispatch' || inputs.update_lms_plugins) }}
        uses: actions/checkout@v4
        with:
          repository: chrober/lms-plugins
          path: lms-plugins
          token: ${{ secrets.LMS_PLUGINS_TOKEN || secrets.MS_PLUGINS_TOKEN }}

      - name: Update lms-plugins repo.xml
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) && (github.event_name != 'workflow_dispatch' || inputs.update_lms_plugins) }}
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          LINUX_URL: ${{ steps.meta.outputs.linux_url }}
          MAC_URL: ${{ steps.meta.outputs.mac_url }}
          WINDOWS_URL: ${{ steps.meta.outputs.windows_url }}
          LINUX_SHA: ${{ steps.package.outputs.linux_sha1 }}
          MAC_SHA: ${{ steps.package.outputs.mac_sha1 }}
          WINDOWS_SHA: ${{ steps.package.outputs.windows_sha1 }}
        run: |
          set -euo pipefail
          python scripts/update_lms_plugins_repo.py \
            --repo-xml lms-plugins/repo.xml \
            --version "$VERSION" \
            --linux-url "$LINUX_URL" --linux-sha "$LINUX_SHA" \
            --mac-url "$MAC_URL" --mac-sha "$MAC_SHA" \
            --windows-url "$WINDOWS_URL" --windows-sha "$WINDOWS_SHA"
          python -c "import xml.etree.ElementTree as ET; ET.parse('lms-plugins/repo.xml')"

      - name: Commit lms-plugins update
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) && (github.event_name != 'workflow_dispatch' || inputs.update_lms_plugins) }}
        working-directory: lms-plugins
        run: |
          set -euo pipefail
          if git diff --quiet -- repo.xml; then
            echo "repo.xml already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add repo.xml
          git commit -m "Publish Better Call Bliss ${{ steps.meta.outputs.version }}"
          git push

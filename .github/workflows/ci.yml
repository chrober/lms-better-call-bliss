name: CI

on:
  push:
  pull_request:

jobs:
  perl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Perl test dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes libjson-xs-perl libdbi-perl libdbd-sqlite3-perl libfile-slurp-perl
      - name: Prepare LMS plugin load path
        run: |
          set -euo pipefail
          mkdir -p Plugins
          ln -s ../BetterCallBliss Plugins/BetterCallBliss
      - name: Run plugin regression tests
        run: prove -l tests
      - name: Run release feed updater tests
        run: python -m unittest discover -s tests -p "test_*.py"

name: CI

on:
  push:
  pull_request:

jobs:
  perl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Perl test dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes libjson-xs-perl
      - name: Run plugin regression tests
        run: prove -l tests
